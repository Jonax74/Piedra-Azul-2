<div class="searchable-select" [class.is-open]="isOpen">
	<input
		[id]="inputId"
		type="search"
		role="combobox"
		[placeholder]="placeholder"
		[value]="query"
		[disabled]="isDisabled"
		[readOnly]="isDisabled"
		[attr.aria-label]="ariaLabel"
		[attr.aria-expanded]="isOpen"
		[attr.aria-controls]="inputId + '-options'"
		[attr.aria-activedescendant]="isOpen && activeIndex >= 0 ? optionId(activeIndex) : null"
		[attr.autocomplete]="'off'"
		(input)="onQueryChange($any($event.target).value)"
		(focus)="open()"
		(blur)="onBlur()"
		(keydown)="onKeydown($event)"
	>
	@if (isOpen) {
		<div class="searchable-options" [id]="inputId + '-options'" role="listbox" [attr.aria-label]="ariaLabel">
			@if (loading) {
				<p class="searchable-status" role="status">{{ loadingMessage }}</p>
			} @else {
				@for (option of filteredOptions; track option.value; let index = $index) {
					<button
						type="button"
						role="option"
						[id]="optionId(index)"
						[attr.aria-selected]="isSelected(option)"
						[class.is-selected]="isSelected(option)"
						[class.is-active]="activeIndex === index"
						(mousedown)="$event.preventDefault()"
						(click)="select(option)"
					>
						<span class="option-copy">
							<strong>{{ option.label }}</strong>
							@if (option.detail) { <small>{{ option.detail }}</small> }
						</span>
						@if (isSelected(option)) { <span class="option-check" aria-hidden="true">✓</span> }
					</button>
				} @empty {
					<p class="searchable-status">{{ emptyMessage }}</p>
				}
			}
		</div>
	}
</div>
