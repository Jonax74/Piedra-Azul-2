<div class="page-shell agenda-page container-fluid px-0">
	<div class="page-heading"><div><span class="eyebrow">Operación diaria</span><h2>Agenda de citas</h2><p>Consulta las citas de un profesional en una fecha determinada.</p></div><span class="status-pill">Hoy, 24 de septiembre</span></div>
	<section class="filter-bar surface row g-3"><label class="col-12 col-md">Profesional<select class="form-select" [(ngModel)]="selectedProfessional"><option value="">Selecciona un médico</option>@for (professional of professionals; track professional) {<option [value]="professional">{{ professional }}</option>}</select></label><label class="col-12 col-md">Fecha<input class="form-control" type="date" [(ngModel)]="selectedDate"></label><div class="col-12 col-md-auto d-flex align-items-end"><button class="primary-button compact btn" type="button">Buscar agenda</button></div></section>
	<section class="surface table-section"><div class="section-header"><div><span class="eyebrow">Resultados</span><h3>Citas del día</h3></div><strong class="count-badge">0 citas</strong></div><div class="empty-state"><span class="empty-icon">+</span><strong>Aún no hay citas para mostrar</strong><p>Selecciona un profesional y una fecha para consultar la agenda.</p></div></section>
</div>
